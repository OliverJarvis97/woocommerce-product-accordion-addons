name: Build plugin release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Build installable plugin ZIP
        run: zip -r WooCommerce-Product-Accordion-Addons-${{ github.event.release.tag_name }}.zip woo-product-accordion-addons -x '*.DS_Store'
      - name: Attach plugin ZIP to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: WooCommerce-Product-Accordion-Addons-${{ github.event.release.tag_name }}.zip
